[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluemedia"
version = "0.1.0"
description = "Python client for the Blue Media payment gateway: XML protocol, SHA-256 signing, BLIK, ITN and recurring notifications."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bluemedia contributors" }]
keywords = ["bluemedia", "payments", "blik", "itn", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bluemedia/bluemedia"
Source = "https://github.com/bluemedia/bluemedia"

[tool.hatch.build.targets.wheel]
packages = ["src/bluemedia"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
